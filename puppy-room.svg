### 🐶 The Puppy's Room

<p align="center">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" width="100%" height="210" style="background:#161b22; border-radius:12px; border:1px solid #30363d;">
    <defs>
      <style>
        /* Room styling */
        .wall { fill: #1f242c; }
        .floor { fill: #13171f; }
        .rug { fill: #ff9e3b; opacity: 0.18; }
        .window-frame { fill: #0d1117; stroke: #30363d; stroke-width: 2; }
        .window-pane { fill: #0f1c2e; }
        .star { fill: #e6edf3; }
        .plant-pot { fill: #d97706; }
        .plant-leaf { fill: #2ea043; }
        .txt { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 11px; fill: #8b949e; font-weight: 600; }
        .paw { fill: #8b949e; opacity: 0.25; }

        /* Smooth pathing loop between Bed -> Food Bowl -> Toy Ball -> Sleep */
        @keyframes pupWalk {
          0%, 20%   { transform: translate(110px, 142px); } /* Sleeping at bed */
          28%       { transform: translate(250px, 142px); } /* Walking to food */
          35%, 52%  { transform: translate(375px, 145px); } /* Eating / drinking */
          60%       { transform: translate(500px, 142px); } /* Trotting to toys */
          68%, 82%  { transform: translate(630px, 142px); } /* Playing with ball */
          92%, 100% { transform: translate(110px, 142px); } /* Back to bed */
        }

        /* Subtle idle bounce for walking */
        @keyframes pupBounce {
          0%, 100% { transform: translateY(0px); }
          50%      { transform: translateY(-4px); }
        }

        /* Toy ball reacting when puppy approaches */
        @keyframes ballBounce {
          0%, 65%, 85%, 100% { transform: translate(655px, 155px); }
          72%                 { transform: translate(665px, 145px); }
          78%                 { transform: translate(658px, 153px); }
        }

        .pup-rig   { animation: pupWalk 16s ease-in-out infinite; }
        .pup-hop   { animation: pupBounce 0.45s ease-in-out infinite; }
        .toy-ball  { animation: ballBounce 16s ease-in-out infinite; }
      </style>
    </defs>

    <!-- Wall & Floor -->
    <rect x="0" y="0" width="760" height="135" class="wall" />
    <rect x="0" y="135" width="760" height="75" class="floor" />
    <line x1="0" y1="135" x2="760" y2="135" stroke="#30363d" stroke-width="2" />

    <!-- Night Sky Window -->
    <rect x="330" y="20" width="100" height="70" rx="6" class="window-frame" />
    <rect x="335" y="25" width="42" height="28" class="window-pane" />
    <rect x="383" y="25" width="42" height="28" class="window-pane" />
    <rect x="335" y="57" width="42" height="28" class="window-pane" />
    <rect x="383" y="57" width="42" height="28" class="window-pane" />
    <!-- Window Stars & Moon -->
    <circle cx="355" cy="38" r="1.5" class="star" />
    <circle cx="405" cy="45" r="1" class="star" />
    <circle cx="395" cy="70" r="1.5" class="star" />
    <circle cx="410" cy="35" r="4" fill="#f1e05a" />

    <!-- House Plant -->
    <rect x="25" y="95" width="26" height="30" rx="3" class="plant-pot" />
    <path d="M 28 95 C 15 75, 10 65, 20 60 C 26 68, 30 80, 32 95 Z" class="plant-leaf" />
    <path d="M 40 95 C 48 70, 58 65, 52 58 C 45 65, 38 78, 36 95 Z" class="plant-leaf" />
    <path d="M 38 95 Q 38 65 38 52 Q 44 65 38 95" stroke="#2ea043" stroke-width="3" fill="none" />

    <!-- Cozy Living Room Rug -->
    <rect x="180" y="148" width="400" height="48" rx="24" class="rug" />
    <rect x="185" y="152" width="390" height="40" rx="20" stroke="#ff9e3b" stroke-width="1" stroke-dasharray="6,4" fill="none" opacity="0.3" />

    <!-- STATION 1: The Bed -->
    <g id="bed-station">
      <rect x="70" y="132" width="95" height="42" rx="14" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
      <rect x="78" y="138" width="79" height="30" rx="10" fill="#f43f5e" opacity="0.8" />
      <rect x="75" y="142" width="22" height="22" rx="6" fill="#fff" opacity="0.3" />
      <text x="117" y="122" text-anchor="middle" class="txt">Nap Corner</text>
    </g>

    <!-- STATION 2: Food & Water Bowls -->
    <g id="food-station">
      <!-- Water Bowl -->
      <ellipse cx="360" cy="162" rx="18" ry="8" fill="#388bfd" opacity="0.9" />
      <ellipse cx="360" cy="160" rx="14" ry="5" fill="#79c0ff" />
      <!-- Food Bowl -->
      <ellipse cx="405" cy="162" rx="18" ry="8" fill="#f0883e" opacity="0.9" />
      <ellipse cx="405" cy="160" rx="14" ry="5" fill="#bd5610" />
      <text x="405" y="158" font-size="12" text-anchor="middle">🍖</text>
      <text x="382" y="122" text-anchor="middle" class="txt">Kitchen</text>
    </g>

    <!-- STATION 3: Toy Area -->
    <g id="toy-station">
      <!-- Bone on floor -->
      <path d="M 605 168 Q 615 165 625 168" stroke="#f0f6fc" stroke-width="4" stroke-linecap="round" />
      <circle cx="605" cy="166" r="3" fill="#f0f6fc" />
      <circle cx="605" cy="170" r="3" fill="#f0f6fc" />
      <circle cx="625" cy="166" r="3" fill="#f0f6fc" />
      <circle cx="625" cy="170" r="3" fill="#f0f6fc" />
      <text x="640" y="122" text-anchor="middle" class="txt">Playground</text>
    </g>

    <!-- Animated Tennis Ball -->
    <g class="toy-ball">
      <circle cx="0" cy="0" r="8" fill="#a3e635" />
      <path d="M -5 -5 Q 0 0 -5 5" stroke="#161b22" stroke-width="1.5" fill="none" />
      <path d="M 5 -5 Q 0 0 5 5" stroke="#161b22" stroke-width="1.5" fill="none" />
    </g>

    <!-- Roaming Puppy Character -->
    <g class="pup-rig">
      <g class="pup-hop">
        <text font-size="34" x="0" y="8" text-anchor="middle">🐶</text>
      </g>
    </g>
  </svg>
</p>

<p align="center"><i>Resident companion wandering through the room: catching a nap, getting a bite, and chasing toys.</i></p>
