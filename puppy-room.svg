<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" width="100%" height="210">
  <defs>
    <style>
      .wall { fill: #1e222b; }
      .floor { fill: #14171f; }
      .baseboard { fill: #282e3a; }
      .rug-outer { fill: #ff9e3b; opacity: 0.15; }
      .rug-inner { stroke: #ff9e3b; stroke-width: 1.5; stroke-dasharray: 6,4; fill: none; opacity: 0.35; }
      .window-outer { fill: #0d1117; stroke: #30363d; stroke-width: 2; }
      .window-pane { fill: #0f172a; }
      .star { fill: #f0f6fc; }
      .moon { fill: #facc15; }
      .lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #8b949e; font-weight: 600; text-anchor: middle; }

      @keyframes puppyMove {
        0%, 20%   { transform: translate(110px, 142px); }
        28%       { transform: translate(250px, 142px); }
        35%, 52%  { transform: translate(380px, 145px); }
        60%       { transform: translate(510px, 142px); }
        68%, 82%  { transform: translate(630px, 142px); }
        92%, 100% { transform: translate(110px, 142px); }
      }

      @keyframes puppyStep {
        0%, 100% { transform: translateY(0px); }
        50%      { transform: translateY(-4px); }
      }

      @keyframes ballReact {
        0%, 65%, 85%, 100% { transform: translate(650px, 155px); }
        72%                 { transform: translate(662px, 146px); }
        78%                 { transform: translate(654px, 153px); }
      }

      .pup-track { animation: puppyMove 16s ease-in-out infinite; }
      .pup-bounce { animation: puppyStep 0.45s ease-in-out infinite; }
      .toy-ball  { animation: ballReact 16s ease-in-out infinite; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="135" class="wall" rx="8" />
  <rect x="0" y="135" width="760" height="75" class="floor" />
  <rect x="0" y="132" width="760" height="6" class="baseboard" />

  <rect x="330" y="18" width="100" height="72" rx="4" class="window-outer" />
  <rect x="335" y="23" width="42" height="30" class="window-pane" />
  <rect x="383" y="23" width="42" height="30" class="window-pane" />
  <rect x="335" y="56" width="42" height="30" class="window-pane" />
  <rect x="383" y="56" width="42" height="30" class="window-pane" />
  <circle cx="352" cy="36" r="1.5" class="star" />
  <circle cx="368" cy="46" r="1" class="star" />
  <circle cx="395" cy="72" r="1.5" class="star" />
  <circle cx="410" cy="34" r="5" class="moon" />

  <rect x="24" y="96" width="24" height="28" rx="2" fill="#d97706" />
  <path d="M 26 96 C 14 74 12 60 22 56 C 28 66 32 78 34 96 Z" fill="#2ea043" />
  <path d="M 38 96 C 46 72 56 64 50 56 C 42 66 36 78 34 96 Z" fill="#238636" />
  <path d="M 36 96 Q 36 68 36 50 Q 42 68 36 96" stroke="#196c2e" stroke-width="2" fill="none" />

  <rect x="170" y="146" width="420" height="50" rx="25" class="rug-outer" />
  <rect x="175" y="150" width="410" height="42" rx="21" class="rug-inner" />

  <!-- Bed Station -->
  <g>
    <rect x="65" y="130" width="95" height="44" rx="14" fill="#21262d" stroke="#30363d" stroke-width="1.5" />
    <rect x="73" y="136" width="79" height="32" rx="10" fill="#f43f5e" opacity="0.85" />
    <rect x="70" y="140" width="22" height="24" rx="6" fill="#ffffff" opacity="0.25" />
    <text x="112" y="120" class="lbl">Bed</text>
  </g>

  <!-- Dining Station -->
  <g>
    <ellipse cx="360" cy="162" rx="18" ry="8" fill="#388bfd" opacity="0.8" />
    <ellipse cx="360" cy="160" rx="14" ry="5" fill="#79c0ff" />
    <ellipse cx="405" cy="162" rx="18" ry="8" fill="#d97706" opacity="0.8" />
    <ellipse cx="405" cy="160" rx="14" ry="5" fill="#f59e0b" />
    <path d="M 398 160 C 398 158 402 158 405 160 C 408 158 412 158 412 160 C 412 162 408 162 405 160 C 402 162 398 162 398 160 Z" fill="#ffffff" />
    <text x="382" y="120" class="lbl">Dinner</text>
  </g>

  <!-- Toys Station -->
  <g>
    <path d="M 600 166 Q 610 163 620 166" stroke="#e6edf3" stroke-width="3" stroke-linecap="round" />
    <circle cx="600" cy="165" r="2.5" fill="#e6edf3" />
    <circle cx="600" cy="168" r="2.5" fill="#e6edf3" />
    <circle cx="620" cy="165" r="2.5" fill="#e6edf3" />
    <circle cx="620" cy="168" r="2.5" fill="#e6edf3" />
    <text x="635" y="120" class="lbl">Toys</text>
  </g>

  <!-- Ball -->
  <g class="toy-ball">
    <circle cx="0" cy="0" r="8" fill="#a3e635" />
    <path d="M -5 -5 Q 0 0 -5 5" stroke="#14171f" stroke-width="1.5" fill="none" />
    <path d="M 5 -5 Q 0 0 5 5" stroke="#14171f" stroke-width="1.5" fill="none" />
  </g>

  <!-- Puppy -->
  <g class="pup-track">
    <g class="pup-bounce">
      <ellipse cx="0" cy="0" rx="14" ry="11" fill="#e0a96d" />
      <path d="M -12 -2 Q -18 -8 -16 -12" stroke="#e0a96d" stroke-width="3.5" stroke-linecap="round" fill="none" />
      <circle cx="10" cy="-6" r="9" fill="#e0a96d" />
      <ellipse cx="6" cy="-4" rx="3.5" ry="6" fill="#a86e3b" />
      <ellipse cx="14" cy="-4" rx="4" ry="3.5" fill="#f5d6ba" />
      <circle cx="17" cy="-5" r="1.5" fill="#1f242c" />
      <circle cx="12" cy="-8" r="1.2" fill="#1f242c" />
      <ellipse cx="-6" cy="10" rx="3" ry="4" fill="#a86e3b" />
      <ellipse cx="6" cy="10" rx="3" ry="4" fill="#a86e3b" />
    </g>
  </g>
</svg>
